# Groundcrew read-only access to a Kubernetes cluster (preview: discovery runs on fixtures until
# TODO(k8s-live)). Apply, then build a kubeconfig for the service account token and upload it on
# the Connections page (it is stored encrypted):
#
#   kubectl apply -f infra/k8s-readonly-rbac.yaml
#   kubectl -n groundcrew create token groundcrew-reader --duration=24h
#
# The ClusterRole can get/list/watch namespaces, Deployments, ReplicaSets, StatefulSets,
# Services, Ingresses, Pods, and events, and read pod logs (incident detection and evidence:
# crash loops, rollouts, error spikes). It has no access to Secrets, ConfigMaps, or exec, and no
# write verb. Emergency fixes need infra/k8s-operate-rbac.yaml on top.
# Remove access with: kubectl delete -f infra/k8s-readonly-rbac.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: groundcrew
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: groundcrew-reader
  namespace: groundcrew
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: groundcrew-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: groundcrew-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: groundcrew-reader
subjects:
  - kind: ServiceAccount
    name: groundcrew-reader
    namespace: groundcrew
