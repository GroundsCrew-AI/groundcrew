# Groundcrew read-only access to a Kubernetes cluster (preview: discovery runs on fixtures until
# TODO(k8s-live)). Apply, then build a kubeconfig for the service account token and upload it on
# the Connections page (it is stored encrypted):
#
#   kubectl apply -f infra/k8s-readonly-rbac.yaml
#   kubectl -n groundcrew create token groundcrew-reader --duration=24h
#
# The ClusterRole can get/list/watch namespaces, Deployments, StatefulSets, Services, Ingresses,
# and Pods. It has no access to Secrets, ConfigMaps, pod logs or exec, or any write verb.
# Remove access with: kubectl delete -f infra/k8s-readonly-rbac.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: groundcrew
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: groundcrew-reader
  namespace: groundcrew
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: groundcrew-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: groundcrew-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: groundcrew-reader
subjects:
  - kind: ServiceAccount
    name: groundcrew-reader
    namespace: groundcrew
