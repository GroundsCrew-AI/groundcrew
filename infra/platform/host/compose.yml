# Groundcrew on the platform host (docs/phase6-plan.md section 5.2). Installed as
# /opt/groundcrew/compose.yml by gc-release; images are built on the host and named in
# /opt/groundcrew/release.env (groundcrew/api:<commit>, groundcrew/web:<commit>). Secrets come from /etc/groundcrew/*.env
# (root only, read by Compose at `up`); nothing secret is in this file or in the images.
# /etc/groundcrew/config.env holds the non-secret settings (models, SMTP host, regions).
#
# Only nginx on the host is public. Postgres has no port at all; the API and the web app publish
# to 127.0.0.1 only (Docker's published ports bypass ufw, so nothing here binds 0.0.0.0).

name: groundcrew

x-service: &service
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  logging:
    driver: journald
    options:
      tag: "{{.Name}}"

x-app: &app
  <<: *service
  image: ${GC_API_IMAGE:?set by gc-release in release.env}
  user: "10001:10001"
  env_file:
    - /etc/groundcrew/config.env
    - /etc/groundcrew/app.env
  environment:
    APP_ENV: production
    # The root filesystem is read-only: every temporary file (kubeconfigs, Docker client
    # configs, repository clones) goes to /scratch, owned by the container's user. The app
    # refuses to start when it is not writable (app/writable.py).
    TMPDIR: /scratch
    HOME: /scratch
  tmpfs:
    - /tmp:size=256m,mode=1777
    - /scratch:size=64m,uid=10001,gid=10001,mode=0700
  volumes:
    - /etc/groundcrew/github-app.pem:/run/secrets/github-app.pem:ro
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

networks:
  # Postgres and the app services only; no way out.
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # The way out for the API, worker, and web app (customer clouds, GitHub, model APIs). The host
  # firewall lets only the API and worker addresses below reach the instance metadata service.
  egress:
    ipam:
      config:
        - subnet: 172.30.1.0/24

volumes:
  pgdata:

services:
  postgres:
    <<: *service
    image: ${GC_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    user: "999:999"
    cap_drop: ["ALL"]
    env_file:
      - /etc/groundcrew/postgres.env
    environment:
      POSTGRES_USER: groundcrew
      POSTGRES_DB: groundcrew
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - max_connections=60
      - -c
      - password_encryption=scram-sha-256
    tmpfs:
      - /var/run/postgresql:size=16m,uid=999,gid=999
      - /tmp:size=64m
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 300
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundcrew -d groundcrew -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    <<: *service
    image: ${GC_API_IMAGE:?set by gc-release in release.env}
    user: "10001:10001"
    restart: "no"
    env_file:
      - /etc/groundcrew/config.env
      - /etc/groundcrew/app.env
    environment:
      APP_ENV: production
    command: ["alembic", "upgrade", "head"]
    tmpfs:
      - /tmp:size=64m
    networks: [backend]
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  # The Groundcrew registry for agent deploys (app/registry.py). The worker uploads tested images
  # over the backend network; agents pull through nginx (/v2/ on the API host, GET and HEAD
  # only, each request checked by the API). Published on 127.0.0.1 for nginx only.
  registry:
    <<: *service
    image: ${GC_REGISTRY_IMAGE:-registry:3.0.0}
    # Its own uid; the storage is a host directory steps/50-app.sh makes for it (a named volume
    # would be created root-owned).
    user: "10002:10002"
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      OTEL_TRACES_EXPORTER: none
    volumes:
      - /var/lib/groundcrew/registry:/var/lib/registry
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      backend: {}
      egress:
        ipv4_address: 172.30.1.13
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    <<: *app
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --proxy-headers
      # Forwarded headers only from nginx on the host, which reaches the container through
      # the egress network's gateway.
      - --forwarded-allow-ips
      - 172.30.1.1
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      backend: {}
      egress:
        ipv4_address: 172.30.1.10
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: production
      # Builds go to the host's rootless gVisor build daemon (app/sandbox/isolated.py).
      SANDBOX_PROVIDER: isolated
      DOCKER_HOST: unix:///run/gcbuild/docker.sock
      BUILDX_CONFIG: /tmp/buildx
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
      # Repository clones (REPO_MAX_BYTES, 300 MB), Builder's Dockerfiles, build contexts, and
      # registry login configs: a tmpfs owned by the worker's user (see x-app).
      TMPDIR: /scratch
      HOME: /scratch
    tmpfs:
      - /tmp:size=256m,mode=1777
      # Counts toward mem_limit: a full 512m still leaves the worker about 768m to run in.
      - /scratch:size=512m,uid=10001,gid=10001,mode=0700
    group_add:
      # gcbuild: may use the build daemon's socket, and nothing else of that user.
      - "1500"
    volumes:
      - /etc/groundcrew/github-app.pem:/run/secrets/github-app.pem:ro
      - /run/user/1500/docker.sock:/run/gcbuild/docker.sock
    networks:
      backend: {}
      egress:
        ipv4_address: 172.30.1.11
    mem_limit: 1280m
    cpus: 1.0
    pids_limit: 400
    # Let the worker finish its current step on `down`; its job is requeued after that.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 60s

  web:
    <<: *service
    image: ${GC_WEB_IMAGE:?set by gc-release in release.env}
    user: "10001:10001"
    env_file:
      - /etc/groundcrew/web.env
    environment:
      APP_ENV: production
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
      AUTH_TRUST_HOST: "true"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=256m,uid=10001,gid=10001
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      backend: {}
      egress:
        ipv4_address: 172.30.1.12
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
