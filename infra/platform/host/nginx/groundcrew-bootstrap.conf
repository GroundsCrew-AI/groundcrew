# Before the first certificate exists: only Let's Encrypt's challenge is answered.
# gc-certs issue replaces this with groundcrew.conf.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__ __API_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 503;
    }
}
