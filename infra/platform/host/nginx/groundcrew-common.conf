# http{} level: limits and defaults shared by the Groundcrew sites.
server_tokens off;
client_max_body_size 1m;

# Clients are the connection's address; nginx overwrites any X-Real-IP or X-Forwarded-For a
# client sends, so the app's per-address limits and audit log cannot be fooled.
limit_req_zone $binary_remote_addr zone=gc_web:10m rate=20r/s;
# Sign-in posts (Auth.js, email links): 10 a minute per address. Reads are not limited here.
map $request_method $gc_auth_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $gc_auth_key zone=gc_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gc_webhook:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=gc_streams:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# TLS for every server (Mozilla intermediate). Protocols are chosen before the name is known,
# from the server that takes the connection, so they belong here, not in one site.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:GCSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# Stapling applies when the certificate names an OCSP responder (Let's Encrypt's no longer do).
ssl_stapling on;
ssl_stapling_verify on;
resolver 169.254.169.253 valid=300s;
resolver_timeout 5s;
