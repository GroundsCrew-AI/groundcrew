# Anything that is not a Groundcrew name (scanners hitting the bare address) gets no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# HTTPS for any other name: refuse the TLS handshake (nothing is served, no certificate shown).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
