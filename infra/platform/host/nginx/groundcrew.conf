# Groundcrew: the web app on __DOMAIN__ (www redirects there) and the API's public routes on
# __API_DOMAIN__. TLS 1.2+, HSTS, OCSP stapling (when the certificate offers it).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__ __API_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# TLS settings that every server shares are in groundcrew-common.conf (http level), so the
# protocol a client gets is TLS 1.2+ whichever server answers the handshake.
ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # HSTS, nosniff, CSP and the other headers come from the web app itself (middleware.ts).
    client_max_body_size 2m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;

    location /api/auth/ {
        limit_req zone=gc_auth burst=10 nodelay;
        limit_req zone=gc_web burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location ~ ^/signin(/|$) {
        limit_req zone=gc_auth burst=10 nodelay;
        limit_req zone=gc_web burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        limit_req zone=gc_web burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __API_DOMAIN__;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # The live run stream, opened by the browser with a 60-second stream token: no buffering,
    # long reads, at most 10 open per address.
    location ~ ^/runs/[0-9a-fA-F-]+/events$ {
        limit_conn gc_streams 10;
        limit_req zone=gc_web burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
        add_header X-Accel-Buffering no;
    }
    # GitHub App webhooks (signed; the API checks the signature).
    location = /github/webhook {
        limit_req zone=gc_webhook burst=50 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    # The Groundcrew registry (app/registry.py): agents pull deploy images, GET and HEAD only,
    # each request checked by the API (a 30-minute pull token for one workspace's images).
    location /v2/ {
        limit_except GET HEAD { deny all; }
        auth_request /_registry_auth;
        error_page 401 = @registry_401;
        limit_req zone=gc_agent burst=200 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }
    location = /_registry_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/internal/registry/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }
    location @registry_401 {
        add_header WWW-Authenticate 'Basic realm="Groundcrew registry"' always;
        add_header Docker-Distribution-Api-Version registry/2.0 always;
        default_type application/json;
        return 401 '{"errors":[{"code":"UNAUTHORIZED","message":"authentication required"}]}';
    }
    # Groundcrew agents on customers' hosts (every request is signed; the API checks it).
    location /agent/v1/ {
        limit_req zone=gc_agent burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }
    location = /ready {
        proxy_pass http://127.0.0.1:8000;
    }
    # Everything else is reached only through the web app's proxy on the internal network.
    location / {
        return 404;
    }
}
