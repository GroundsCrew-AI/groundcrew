# Groundcrew: the web app on __DOMAIN__ (www redirects there) and the API's public routes on
# __API_DOMAIN__. TLS 1.2+, HSTS, OCSP stapling (when the certificate offers it).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__ __API_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Shared TLS settings (Mozilla intermediate).
ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:GCSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;
resolver 169.254.169.253 valid=300s;
resolver_timeout 5s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 2m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;

    location /api/auth/ {
        limit_req zone=gc_auth burst=10 nodelay;
        limit_req zone=gc_web burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location /signin/ {
        limit_req zone=gc_auth burst=10 nodelay;
        limit_req zone=gc_web burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        limit_req zone=gc_web burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __API_DOMAIN__;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # The live run stream, opened by the browser with a 60-second stream token: no buffering,
    # long reads, at most 10 open per address.
    location ~ ^/runs/[0-9a-fA-F-]+/events$ {
        limit_conn gc_streams 10;
        limit_req zone=gc_web burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
        add_header X-Accel-Buffering no;
    }
    # GitHub App webhooks (signed; the API checks the signature).
    location = /github/webhook {
        limit_req zone=gc_webhook burst=50 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }
    location = /ready {
        proxy_pass http://127.0.0.1:8000;
    }
    # Everything else is reached only through the web app's proxy on the internal network.
    location / {
        return 404;
    }
}
