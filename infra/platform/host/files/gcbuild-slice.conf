# Everything the build daemon runs (BuildKit, the app under test, the probe) lives in this
# slice. Under a rootless daemon gVisor cannot enforce per-container limits, so this is the
# ceiling; one build runs at a time, so it is the per-build limit (docs/phase6-plan.md 6.3).
[Slice]
MemoryHigh=3328M
MemoryMax=3584M
MemorySwapMax=512M
TasksMax=4096
CPUQuota=200%
