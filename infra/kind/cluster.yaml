# Local kind cluster for Groundcrew deploys (make kind-up). One node; ports 80 and 443 on
# 127.0.0.1 go to the ingress controller, so apps are reachable at http://<app>.localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: groundcrew
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    # Kubernetes 1.37 (>= 1.30 is required: the deployer's namespace limits are a
    # ValidatingAdmissionPolicy). Pinned by digest, from the kind v0.33.0 release notes.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
# Registry mirrors come from /etc/containerd/certs.d (kind-up.sh writes localhost:5001 there).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
