# Local development. api, worker, and web hot reload from the mounted source.
# Postgres runs here for local dev and tests. Neon is only for the hosted demo.
x-api-env: &api-env
  # Overrides any DATABASE_URL in .env so local dev never touches the hosted database.
  DATABASE_URL: postgresql+asyncpg://groundcrew:groundcrew@postgres:5432/groundcrew
  # Local development: enables dev-only tools; a hosted instance leaves it unset (production).
  APP_ENV: dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: groundcrew
      POSTGRES_PASSWORD: groundcrew
      POSTGRES_DB: groundcrew
    # Host port 5433 so it does not clash with a Postgres already running on the host.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundcrew -d groundcrew"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment: *api-env
    volumes:
      - ./apps/api/app:/app/app
      # The GitHub App private key (GITHUB_APP_PRIVATE_KEY_PATH=secrets/...), read-only.
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./apps/api
    command: python -m app.worker
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
      # Sandbox builds go to the dind service over TLS, never to the host's Docker daemon.
      DOCKER_HOST: tcp://dind:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      # Containers started for a smoke test publish their ports on dind, not on localhost.
      SANDBOX_SMOKE_HOST: dind
    volumes:
      - ./apps/api/app:/app/app
      # The GitHub App private key (GITHUB_APP_PRIVATE_KEY_PATH=secrets/...), read-only.
      - ./secrets:/app/secrets:ro
      - dind-certs-client:/certs/client:ro
    depends_on:
      postgres:
        condition: service_healthy
      dind-certs:
        condition: service_completed_successfully
    # Let the worker finish its current step on `docker compose down`.
    stop_grace_period: 30s

  # Docker daemon for sandbox builds (docs/phase4-infra.md, Build daemon). Local dev only:
  # it must be privileged, so a hosted instance builds on a separate build host instead.
  # No published ports: only services on the compose network (the worker) reach it, with the
  # client certificate in dind-certs-client (copied there by dind-certs).
  dind:
    image: docker:29.7.2-dind
    # dind puts its hostname in the server certificate, which the worker checks against "dind".
    hostname: dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - dind-certs-ca:/certs/ca
      # dind writes its client certificate here, key world-readable, on every start.
      - dind-certs-issued:/certs/client
      # Images and the BuildKit cache, kept across restarts (pruned at 10GB, daemon.json).
      - dind-data:/var/lib/docker
      - ./infra/dind/daemon.json:/etc/docker/daemon.json:ro
    cpus: ${DIND_CPUS:-2}
    mem_limit: ${DIND_MEMORY:-4g}
    pids_limit: 2048
    healthcheck:
      test: ["CMD", "docker", "--host", "unix:///var/run/docker.sock", "info", "--format", "{{.ID}}"]
      interval: 2s
      timeout: 5s
      retries: 60

  # One shot, after dind has written the certificates: copies the client certificate into the
  # worker's volume, owned by its user (appuser, uid 1000), key 0600, directory 0700. A copy,
  # because dind resets its own key.pem to 0644 whenever it starts. Runs on every `up`.
  dind-certs:
    image: alpine:3.22.2
    command:
      - sh
      - -euc
      - |
        rm -rf /certs/client/*
        cp /certs/issued/ca.pem /certs/issued/cert.pem /certs/issued/key.pem /certs/client/
        chown -R 1000:1000 /certs/client
        chmod 0700 /certs/client
        chmod 0644 /certs/client/ca.pem /certs/client/cert.pem
        chmod 0600 /certs/client/key.pem
    volumes:
      - dind-certs-issued:/certs/issued:ro
      - dind-certs-client:/certs/client
    depends_on:
      dind:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    # Run as the host user so files Next writes into the mounted source (.next) stay yours.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Read by the browser, so it points at the host port, not the compose service name.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Server-side calls from the web container to the API go over the compose network.
      API_INTERNAL_URL: http://api:8000
      # Auth.js runs behind Docker's port mapping, not on Vercel.
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
      # npm wants a writable home for its logs; the host user has none in the image.
      HOME: /tmp
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  dind-certs-ca:
  dind-certs-issued:
  dind-certs-client:
  dind-data:
