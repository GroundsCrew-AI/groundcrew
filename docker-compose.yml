# Local development. api, worker, and web hot reload from the mounted source.
# Postgres runs here for local dev and tests. Neon is only for the hosted demo.
x-api-env: &api-env
  # Overrides any DATABASE_URL in .env so local dev never touches the hosted database.
  DATABASE_URL: postgresql+asyncpg://groundcrew:groundcrew@postgres:5432/groundcrew

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: groundcrew
      POSTGRES_PASSWORD: groundcrew
      POSTGRES_DB: groundcrew
    # Host port 5433 so it does not clash with a Postgres already running on the host.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundcrew -d groundcrew"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment: *api-env
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./apps/api
    command: python -m app.worker
    env_file:
      - path: .env
        required: false
    environment: *api-env
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    # Let the worker finish its current step on `docker compose down`.
    stop_grace_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    # Run as the host user so files Next writes into the mounted source (.next) stay yours.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Read by the browser, so it points at the host port, not the compose service name.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Server-side calls from the web container to the API go over the compose network.
      API_INTERNAL_URL: http://api:8000
      # Auth.js runs behind Docker's port mapping, not on Vercel.
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
      # npm wants a writable home for its logs; the host user has none in the image.
      HOME: /tmp
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
