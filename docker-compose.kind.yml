# Joins api, worker, and dind to the kind cluster's Docker network, so Groundcrew in Compose
# reaches the cluster at https://groundcrew-control-plane:6443 (the server in
# .kind/groundcrew-deployer.kubeconfig) and the registry at kind-registry:5000.
# Used by `make dev KIND=1` after `make kind-up` (the network exists only once kind has run).
services:
  api:
    networks: [default, kind]
  worker:
    networks: [default, kind]
    environment:
      # Builds in dind push here; kind nodes pull the same name (make kind-up adds the mirror).
      GC_KIND_REGISTRY: kind-registry:5000
      # Verify reaches apps through ingress-nginx on the control-plane node (Host: <app>.localhost).
      GC_KIND_INGRESS_URL: http://groundcrew-control-plane
  dind:
    # The kind network only for pushing to kind-registry:5000. Internet traffic (apt, pip, base
    # images) keeps the compose network's gateway: through the kind network it crawled (about
    # 2 KB/s for apt in a build, 2026-10-12), so the default route is pinned here.
    networks:
      default:
        gw_priority: 1
      kind: {}

networks:
  kind:
    external: true
