# Joins api and worker to the kind cluster's Docker network, so Groundcrew in Compose reaches
# the cluster at https://groundcrew-control-plane:6443 (the server in
# .kind/groundcrew-deployer.kubeconfig) and the registry at kind-registry:5000.
# Used by `make dev KIND=1` after `make kind-up` (the network exists only once kind has run).
services:
  api:
    networks: [default, kind]
  worker:
    networks: [default, kind]

networks:
  kind:
    external: true
