# Groundcrew agent configuration. After a change: sudo groundcrew-agent check, then
# sudo systemctl restart groundcrew-agent.
groundcrew:
  url: https://api.groundkrew.com

# List the services the agent watches. Nothing is allowed unless a service's `allow` lists it,
# and every action still needs an approval in Groundcrew.
