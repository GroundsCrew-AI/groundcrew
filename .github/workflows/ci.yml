name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, mypy, migrations, pytest, API types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: groundcrew
          POSTGRES_PASSWORD: groundcrew
          POSTGRES_DB: groundcrew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundcrew -d groundcrew_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    # No secrets: tests fake the LLM and never call Token Factory. Live tests (marker `live`:
    # kind, AWS, GitHub) run only with RUN_LIVE_TESTS=1, which CI never sets.
    env:
      DATABASE_URL: postgresql+asyncpg://groundcrew:groundcrew@localhost:5432/groundcrew_test
      TEST_DATABASE_URL: postgresql+asyncpg://groundcrew:groundcrew@localhost:5432/groundcrew_test
      RUN_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      # The runner's Docker daemon runs the `docker` tests (dind config, compose files).
      - name: Docker
        run: docker info --format 'Docker {{.ServerVersion}}, {{.OperatingSystem}}, {{.NCPU}} CPUs'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check . ../../scripts
      - run: uv run ruff format --check . ../../scripts
      - run: uv run mypy app tests ../../scripts
      - name: Alembic has one head
        run: |
          heads=$(uv run alembic heads)
          echo "$heads"
          if [ "$(printf '%s\n' "$heads" | grep -c .)" -ne 1 ]; then
            echo "::error::alembic heads lists more than one head. Merge the migrations first."
            exit 1
          fi
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Infra checks (compose and dind, kind manifests, connect template, cleanup)
        run: >-
          uv run pytest -q tests/test_compose_dind.py tests/test_docker_infra.py
          tests/test_kind_manifests.py tests/test_aws_connect_template.py
          tests/test_deploy_cleanup.py tests/test_migrations_head.py
      - run: uv run pytest
      - name: Web client types match the API
        run: |
          PYTHONPATH=. uv run python ../../scripts/export_openapi.py ../web/lib/api/openapi.json
          git diff --exit-code ../web/lib/api/openapi.json || {
            echo "::error::apps/web/lib/api/openapi.json is out of date. Run make api-types and commit."
            exit 1
          }

  web:
    name: Web (eslint, tsc, vitest, next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Generated API types are current
        run: |
          npx openapi-typescript lib/api/openapi.json -o lib/api/schema.d.ts
          git diff --exit-code lib/api/schema.d.ts
      - run: npm test
      # No auth secrets in CI: the build must not need them.
      - run: npm run build

  e2e:
    name: E2E (Playwright, fake mode)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: groundcrew
          POSTGRES_PASSWORD: groundcrew
          POSTGRES_DB: groundcrew
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundcrew -d groundcrew"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    # Fake mode (APP_ENV=dev, PIPELINE_FAKE=1): no Token Factory, no Docker builds, no cluster.
    # The test sign-in exists only with APP_ENV=dev and E2E_TEST_AUTH=1 (scripts/e2e.sh sets both).
    env:
      E2E_DB_URL: postgresql+asyncpg://groundcrew:groundcrew@localhost:5432/groundcrew_e2e
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
        working-directory: apps/api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: scripts/e2e.sh
      - name: Logs and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            .e2e/
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

