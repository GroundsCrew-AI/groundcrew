name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, mypy, migrations, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: groundcrew
          POSTGRES_PASSWORD: groundcrew
          POSTGRES_DB: groundcrew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundcrew -d groundcrew_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    # No secrets: tests fake the LLM and never call Token Factory.
    env:
      DATABASE_URL: postgresql+asyncpg://groundcrew:groundcrew@localhost:5432/groundcrew_test
      TEST_DATABASE_URL: postgresql+asyncpg://groundcrew:groundcrew@localhost:5432/groundcrew_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check . ../../scripts
      - run: uv run ruff format --check . ../../scripts
      - run: uv run mypy app tests ../../scripts
      - name: Run migrations
        run: uv run alembic upgrade head
      - run: uv run pytest

  web:
    name: Web (eslint, tsc, next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
